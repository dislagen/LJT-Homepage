# Build settings for local preview and the generation of the site
# Set Which Environment to use
# This is set in the config file so that it can be overridden by the CLI/ENV Variables
environment: development
#environment: production

# This is the title of your website
# The `title` is the main name of your site, used in the nav bar and as the title of the site
title: Junteng Liu
# The `description` is the default description that is used in the meta tags
description: Junteng Liu's Homepage
# These are the keywords that are used in the meta tags
# It is recommended to use no more than 20 keywords
keywords: Junteng Liu, NLP, machine learning, LLM
# The `favicon` is the path to the favicon in the assets/images/ directory
favicon: false
# The `logo` is the path to the logo in the assets/images/ directory
#logo: assets/images/avatar.png
# The `mobile_logo` is the path to the mobile logo in the assets/images/ directory
#mobile_logo: assets/images/mobile_logo.png

# This is the default image that is used in the meta tags
#avatar: assets/images/avatar.png

# This text is shown in the footer of the website
# The default is " Powered by Jekyll and academicpages"
not_powered_by: false

# This is the repository that the website is hosted on
repository: dislagen/LJT-Homepage
# This is the URL that is used to generate the sitemap
url: "https://dislagen.github.io"
# This is the baseurl that is used to generate the sitemap
baseurl: "/LJT-Homepage"

# This is the default image that is used in the meta tags
avatar: assets/images/avatar.png

# Analytics
analytics:
  # The provider is the service that is used to track the visitors
  provider: false
  # Google Analytics
  google:
  #  tracking_id:  # The tracking ID is the ID of the Google Analytics account
  #  anonymize_ip: false
  #  site_speed_sample_rate: 0
  #  site_hit_sample_rate: 0

  # GetAnalytics
  # getanalytics:
  #  token:  # The token is the token of the GetAnalytics account

  # Matomo
  # matomo:
  #  token:  # The token is the token of the Matomo account

  # Plausible
  # plausible:
  #  token:  # The token is the token of the Plausible account

# Twitter
twitter:
  # The username is the username of the Twitter account
  username: junteng88716710
  # The image is the image that is used in the Twitter meta tags
  #image: assets/images/avatar.png
  # The description is the description that is used in the Twitter meta tags
  #description: A (free) personal website theme for a academic/technical personal portfolio, built with Jekyll

# Open Graph
og_image:
  # The path is the path to the image in the assets/images/ directory
  path: assets/images/avatar.png
  # The height is the height of the image
  height: 150
  # The width is the width of the image
  width: 150
  # The version is the version of the image
  version: 1

# Site Author
# The `author` block is used to configure the author of the website
author:
  # The `name` is the name of the author
  name: "Junteng Liu"
  # The `avatar` is the path to the avatar in the assets/images/ directory
  avatar: "assets/images/avatar.png"
  # The `bio` is the bio of the author
  bio: "First-year PhD candidate at HKUST NLP Group."
  # The `location` is the location of the author
  location: "Hong Kong"
  # The `links` are the links that are displayed in the author profile
  # The links are displayed in the order that they are listed
  # The links are:
  #  - email
  #  - github
  #  - scholar
  #  - x (Twitter)
  links:
    email: "jliugi@connect.ust.hk"
    github: "https://github.com/Vicent0205"
    scholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    x: "https://x.com/junteng88716710"

# Behavioral settings
# The `locale` is the locale of the website
locale: en-US
# The `date_format` is the format that is used to display the date
date_format: "%B %d, %Y"
# The `breadcrumbs` is used to enable or disable the breadcrumbs
breadcrumbs: false
# The `post_nav` is used to enable or disable the post navigation
post_nav: true
# The `touch_font_size` is the font size that is used on touch devices
touch_font_size: 16
# The `read_time` is used to enable or disable the read time
read_time: false
# The `words_per_minute` is the number of words per minute that is used to calculate the read time
words_per_minute: 200
# The `comments` is used to enable or disable the comments
comments: false
# The `reCaptcha` is used to configure the reCaptcha
reCaptcha:
  siteKey:
  secretKey:
# The `atom_feed` is used to configure the Atom feed
atom_feed:
  path: false
# The `search` is used to enable or disable the search
search: true
# The `search_content` is used to configure the search content
search_content: "full"
# The `override_title` is used to override the title of the page
override_title: false
# The `override_title_text` is used to override the title of the page with the text
override_title_text: ""
# The `tag_grid` is used to enable or disable the tag grid
tag_grid: false
# The `category_grid` is used to enable or disable the category grid
category_grid: false
# The `feature_tag` is used to feature the tags
feature_tag:
  -
  -
  -
  -
  -

# Style settings
# The `hair_color` is the color of the hair
hair_color:
# The `hair_cut` is the cut of the hair
hair_cut:
# The `fluid_images` is used to enable or disable the fluid images
fluid_images: true
# The `attrs` is used to configure the attributes
attrs:
  # The `seo_programming` is used to enable or disable the SEO programming
  seo_programming: true
  # The `seo_maximage` is used to enable or disable the SEO max image
  seo_maximage: true
  # The `repaired_for` is used to repair the attributes for the browsers
  repaired_for:
    -
    -
    -
    -
    -
    -

# Reading
# The `quote_color` is the color of the quote
quote_color: rgba(0, 0, 0, 0.1)

# Paragraph
# The `paragraph` is used to configure the paragraph
paragraph:
  # The `type` is the type of the paragraph
  type: classic
  # The `first_mult` is the multiplier of the first letter
  first_mult: 1
  # The `drop_cap` is used to enable or disable the drop cap
  drop_cap: false

# List
# The `list` is used to configure the list
list:
  # The `type` is the type of the list
  type: default
  # The `style` is the style of the list
  style: inline

# Table
# The `table` is used to configure the table
table:
  # The `type` is the type of the table
  type: default

# Buttons
# The `buttons` is used to configure the buttons
buttons:
  # The `type` is the type of the buttons
  type: bordered

# Not capture
# The `not_capture` is used to configure the not capture
not_capture:
  # The `type` is the type of the not capture
  type: default

# Syntax highlighting
# The `syntax_highlighter` is used to configure the syntax highlighting
syntax_highlighter:
  # The `type` is the type of the syntax highlighting
  type: default

# Collections
# The `collections` are the collections that are used in the website
collections:
  # The `publications` collection is used to store the publications
  publications:
    output: true
    sort_by: date
  # The `talks` collection is used to store the talks
  talks:
    output: true
    sort_by: date
  # The `teaching` collection is used to store the teaching
  teaching:
    output: true
    sort_by: semester
  # The `portfolio` collection is used to store the portfolio
  portfolio:
    output: true
    sort_by: order

# Defaults
# The `defaults` are the default values that are used in the website
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
      comments: false
      share: true
      related: true
      show_author_profile: false
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      sitemap: false
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: paper
      sitemap: false
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      sitemap: false
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: teaching
      sitemap: false
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: portfolio
      sitemap: false

# Styling
# The `sass` is used to configure the Sass
sass:
  # The `style` is the style of the Sass
  style: compressed
  # The `sass_dir` is the directory of the Sass
  sass_dir: _sass

# The `compress_html` is used to configure the compression of the HTML
compress_html:
  # The `clippings` are the clippings that are used to compress the HTML
  clippings: all
  # The `comments` are the comments that are used to compress the HTML
  comments: ["<!-- ", " -->"]
  # The `ignores` are the ignores that are used to compress the HTML
  ignores:
  # The `blanklines` is used to enable or disable the blank lines
  blanklines: false
  # The `startings` are the startings that are used to compress the HTML
  startings: [html, head, body]

# Plugins
# The `plugins` are the plugins that are used in the website
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-gist

# Permalinks
# The `permalink` is the permalink that is used in the website
permalink: /:categories/:title/
# The `paginate` is the number of posts that are displayed per page
paginate: 5
# The `paginate_path` is the path that is used to paginate the posts
paginate_path: /blog/page:num

# The `category_archive` is used to configure the category archive
category_archive:
  # The `type` is the type of the category archive
  type: liquid
  # The `path` is the path of the category archive
  path: categories/
# The `tag_archive` is used to configure the tag archive
tag_archive:
  # The `type` is the type of the tag archive
  type: liquid
  # The `path` is the path of the tag archive
  path: tags/
# The `episode_archive` is used to configure the episode archive
episode_archive:
  # The `type` is the type of the episode archive
  type: liquid
  # The `path` is the path of the episode archive
  path: episodes/

# The `fonts` are the fonts that are used in the website
fonts:
  # The `unifraktur` is the unifraktur font
  - unifraktur

# The `module` is used to configure the module
module:
  # The `air_mode` is used to enable or disable the air mode
  air_mode: false

# The `vor(service)` is used to configure the vor(service)
vor(service):
  # The `btn-creator` is used to enable or disable the btn-creator
  btn-creator: false

# Jekyll
# The `markdown` is the markdown engine that is used in the website
markdown: kramdown
# The `highlighter` is the highlighter that is used in the website
highlighter: rouge
# The `kramdown` is used to configure the kramdown
kramdown:
  # The `input` is the input of the kramdown
  input: GFM
  # The `syntax_highlighter` is the syntax highlighter of the kramdown
  syntax_highlighter: rouge
  # The `syntax_highlighter_opts` is the syntax highlighter options of the kramdown
  syntax_highlighter_opts:
    # The `disable` is used to disable the syntax highlighter
    disable: false
    # The `span` is the span of the syntax highlighter
    span:
      # The `line_numbers` is used to enable or disable the line numbers
      line_numbers: false
    # The `block` is the block of the syntax highlighter
    block:
      # The `line_numbers` is used to enable or disable the line numbers
      line_numbers: false

